name: Fetch News

on:
  # Corre automáticamente cada 30 minutos
  schedule:
    - cron: '*/30 * * * *'
  # Permite correrlo manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

# Permite al workflow hacer push de vuelta al repo
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fetch script
        run: node .github/scripts/fetch-news.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f js/data/news.json
          if git diff --staged --quiet; then
            echo "Sin cambios en news.json"
          else
            git commit -m "chore(news): actualizar news.json [skip ci]"
            git push
          fi